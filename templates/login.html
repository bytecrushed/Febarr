<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Febarr - Sign in</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="login-main">
    <section class="panel login-panel">
      <h1 class="login-title"><img class="brand-logo" src="{{ url_for('static', filename='icon.png') }}" alt="Febarr"></h1>
      <p class="hint" style="margin-top: -2px;">Sign in to continue</p>
      {% if error %}
        <p class="login-error"><span class="material-symbols-outlined icon-inline">error</span>{{ error }}</p>
      {% endif %}
      <form method="post" action="{{ url_for('login') }}" style="margin-top: 14px;">
        <input type="hidden" name="next" value="{{ next_path }}">
        <label>
          <span class="material-symbols-outlined icon-inline">person</span>Username
          <input type="text" name="username" autocomplete="username" autofocus required>
        </label>
        <label>
          <span class="material-symbols-outlined icon-inline">lock</span>Password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;"><span class="material-symbols-outlined icon-inline">login</span>Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
